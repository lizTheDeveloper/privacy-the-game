name: Deploy Reclaim City

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GAMES_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.GAMES_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to play portal
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='.claude' \
            --exclude='.github' \
            ./src/ root@${{ secrets.GAMES_HOST }}:/opt/play-portal/reclaim-city/

      - name: Rebuild play portal container
        run: |
          ssh root@${{ secrets.GAMES_HOST }} \
            'cd /opt/play-portal && docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d'

      - name: Health check
        run: |
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://play.multiversestudios.xyz/reclaim-city/)
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed: HTTP $RESPONSE"
            exit 1
          fi
          echo "Reclaim City is live at https://play.multiversestudios.xyz/reclaim-city/"

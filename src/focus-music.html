<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050710">
  <title>Focus music · Reclaim City</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- The game's own font link (index.html), so the browser already has it: Orbitron for the logo only. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root { --cyan: #00E5FF; --lime: #C6FF00; --midnight: #090B10; --offwhite: #EDEFF3; color-scheme: dark;
      /* The game's font tokens (style.css). */
      --font-title: 'IBM Plex Sans', system-ui, sans-serif;
      --font-logo: 'Orbitron', sans-serif;
      --font-body: 'Inter', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #111827 0%, var(--midnight) 70%);
      color: var(--offwhite); font: 15px/1.4 var(--font-body);
      display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px 20px;
    }
    .brand { font: 800 12px/1 var(--font-logo); letter-spacing: 0.18em; color: var(--cyan); }
    .now { min-height: 2.8em; }
    .now-label { font-size: 12px; color: rgba(237,239,243,0.6); }
    .now-title { font-family: var(--font-title); font-size: 18px; font-weight: 700; }
    .controls { display: flex; align-items: center; gap: 10px; }
    button {
      font: inherit; color: var(--offwhite); background: rgba(255,255,255,0.05);
      border: 1px solid rgba(237,239,243,0.2); border-radius: 10px; min-height: 44px; min-width: 44px;
      padding: 0 12px; cursor: pointer; font-family: var(--font-title);
    }
    button:hover { border-color: rgba(0,229,255,0.6); }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    #play { min-width: 104px; font-weight: 700; color: var(--midnight); background: var(--cyan); border-color: var(--cyan); }
    #play[aria-pressed="true"] { color: var(--cyan); background: transparent; }
    .volume { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(237,239,243,0.7); }
    .volume input { flex: 1; accent-color: var(--cyan); }
    .note { font-size: 12px; color: rgba(237,239,243,0.6); margin: 0; }
    .note[data-blocked] { color: var(--lime); }
    #back { align-self: flex-start; font-size: 13px; min-height: 36px; }
  </style>
</head>
<body>
  <div class="brand">RECLAIM CITY · FOCUS MUSIC</div>
  <div class="now" aria-live="polite">
    <div class="now-label" id="count">Track 1 of 7</div>
    <div class="now-title" id="title">Focus and Mine</div>
  </div>
  <div class="controls">
    <button type="button" id="prev" aria-label="Previous track">&#9198;</button>
    <button type="button" id="play" aria-pressed="false">&#9654; Play</button>
    <button type="button" id="next" aria-label="Next track">&#9197;</button>
  </div>
  <label class="volume">Volume <input type="range" id="volume" min="0" max="100" value="35"></label>
  <p class="note" id="note">Keeps playing while you use Reclaim City in any tab. Close this window to stop.</p>
  <button type="button" id="back">&#8592; Back to Reclaim City</button>
  <script type="module" src="focus-player.js"></script>
</body>
</html>
